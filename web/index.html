<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SmartSecurePune — Demo UI</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    html,body,#map { height: 100%; margin: 0; padding: 0; }
    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(255,255,255,0.95); padding: 12px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2); min-width: 300px;
    }
    #status { font-size: 0.85rem; color: #444; margin-top: 8px; }
    input,select { width: 100%; padding: 6px; margin: 6px 0; box-sizing: border-box; }
    button { padding: 8px 12px; margin-right: 8px; }
    .small { font-size: 0.9rem; color: #333; }
  </style>
</head>
<body>
  <div id="panel">
    <h3 style="margin:0 0 6px 0">SmartSecurePune</h3>
    <div class="small">Source (ID or name)</div>
    <input id="src" placeholder="e.g., 11001 or Shivaji" value="Shivaji"/>
    <div class="small">Destination (ID or name)</div>
    <input id="dst" placeholder="e.g., Hinjewadi or 11007" value="Hinjewadi"/>
    <div class="small">Mode</div>
    <select id="mode">
      <option value="1">Fastest</option>
      <option value="2">Safest</option>
    </select>
    <div class="small">Alpha (safety weight, only for Safest)</div>
    <input id="alpha" value="2.0" />
    <div style="margin-top:8px">
      <button id="goBtn">Compute Route</button>
      <button id="refreshBtn">Reload last_route.json</button>
      <button id="downloadBtn">Download last_route.json</button>
    </div>
    <div id="status">Ready</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const serverBase = ''; // same origin
    const map = L.map('map').setView([18.52, 73.86], 12);
    const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

tileLayer.on('tileerror', function(error, tile) {
  console.warn('Tile load error', error);
  // show a persistent overlay message
  let existing = document.getElementById('tileErrorMsg');
  if(!existing){
    const el = document.createElement('div');
    el.id = 'tileErrorMsg';
    el.style.position = 'absolute';
    el.style.right = '10px';
    el.style.bottom = '10px';
    el.style.padding = '8px 12px';
    el.style.background = 'rgba(255,200,200,0.95)';
    el.style.border = '1px solid #c00';
    el.style.borderRadius = '6px';
    el.style.zIndex = 2000;
    el.textContent = 'Map tiles unavailable (offline or blocked). Routes will still display if coordinates are present.';
    document.body.appendChild(el);
  }
});



    let routeLayerGroup = L.layerGroup().addTo(map);
    let markerGroup = L.layerGroup().addTo(map);

    function setStatus(txt, isError) {
      const s = document.getElementById('status');
      s.textContent = txt;
      s.style.color = isError ? 'crimson' : '#333';
    }

    async function fetchRouteFromServer(payload) {
      setStatus('Running backend...', false);
      try {
        const res = await fetch('/route', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const j = await res.json();
        return j;
      } catch (e) {
        return { ok: false, msg: 'Network or server error', error: e.toString() };
      }
    }

    function drawRoute(route) {
      routeLayerGroup.clearLayers();
      markerGroup.clearLayers();
      if(!route) { setStatus('No route', true); return; }

  // prefer route.full_polyline (array of [lat,lon]) from server
      let latlngs = [];
      if(route.full_polyline && route.full_polyline.length > 0){
      latlngs = route.full_polyline.map(p => [p[0], p[1]]);
      } else if(route.nodes && route.nodes.length > 0){
      latlngs = route.nodes.map(n => [n.lat, n.lon]);
      } else {
      setStatus('No coordinates available to draw route', true);
      return;
      }

    // draw main polyline
      const poly = L.polyline(latlngs, { color: '#0077cc', weight: 6, opacity: 0.9 }).addTo(routeLayerGroup);
      map.fitBounds(poly.getBounds(), { padding: [40,40] });

  // add markers (use nodes if available)
      if(route.nodes && route.nodes.length > 0){
        route.nodes.forEach((n, i) => {
          const m = L.marker([n.lat, n.lon]).addTo(markerGroup);
          m.bindPopup(`<b>${n.label||n.node_id}</b><br/>ID: ${n.node_id}`);
        });
      } else {
    // if nodes not present, optionally add start/end markers from polyline
        const s = latlngs[0], e = latlngs[latlngs.length-1];
        L.marker(s).addTo(markerGroup).bindPopup("Start");
        L.marker(e).addTo(markerGroup).bindPopup("End");
      }
      setStatus(`${route.mode || ''} • ${route.total_distance_km ? route.total_distance_km.toFixed(2) + ' km' : ''} • avg safety ${route.avg_safety ? route.avg_safety.toFixed(1) : ''}`, false);
    }

    async function handleCompute() {
      const src = document.getElementById('src').value.trim();
      const dst = document.getElementById('dst').value.trim();
      const mode = document.getElementById('mode').value;
      const alpha = document.getElementById('alpha').value.trim() || "2.0";

      if(!src || !dst) { setStatus('Enter both source and destination', true); return; }
      setStatus('Sending request...', false);
      const payload = { src, dst, mode, alpha };
      const res = await fetchRouteFromServer(payload);
      if(!res.ok) {
        console.error(res);
        const errMsg = res.msg || (res.stderr || res.error) || 'Unknown error';
        setStatus('Error: ' + errMsg, true);
        return;
      }
      // got route
      if(res.route) {
        drawRoute(res.route);
      } else {
        setStatus('No route returned', true);
      }
      // show stdout (brief) in console for debug
      console.log('backend stdout:', res.stdout || '');
      console.log('backend stderr:', res.stderr || '');
    }

    async function reloadLastRoute() {
      setStatus('Loading last_route.json...', false);
      try {
        const r = await fetch('/last_route.json', {cache:'no-store'});
        if(!r.ok) { setStatus('last_route.json not found', true); return; }
        const route = await r.json();
        drawRoute(route);
      } catch (e) {
        setStatus('Error loading last_route.json', true);
        console.error(e);
      }
    }

    document.getElementById('goBtn').onclick = handleCompute;
    document.getElementById('refreshBtn').onclick = reloadLastRoute;
    document.getElementById('downloadBtn').onclick = () => {
      window.location.href = '/last_route.json';
    };

    // auto-load last route on startup (if present)
    reloadLastRoute();
  </script>
</body>
</html>
