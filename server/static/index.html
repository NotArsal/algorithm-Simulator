<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Smart & Secure Navigation — Pune Demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;}
    #topbar{padding:10px;background:#222;color:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    #controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    select, input[type="text"]{padding:6px;border-radius:6px;border:1px solid #ddd;}
    button{padding:6px 10px;border-radius:6px;border:0;background:#3b82f6;color:white;cursor:pointer;}
    #map{height:calc(100vh - 72px);}
    #log{position:absolute;right:10px;top:80px;z-index:9999;background:rgba(255,255,255,0.95);padding:8px;border-radius:6px;max-width:360px;font-size:13px;overflow:auto;max-height:40vh;}
    label{font-weight:600;margin-right:6px;color:#ddd;}
    .small{font-size:12px;color:#aaa;}
    .hidden{display:none;}
  </style>
</head>
<body>
  <div id="topbar">
    <div id="controls">
      <label for="srcSelect">Start</label>
      <select id="srcSelect" title="Choose start location">
        <option value="">-- choose start --</option>
        <option value="18.498600,73.863800">Swargate</option>
        <option value="18.531000,73.856700">Shivaji Nagar</option>
        <option value="18.516500,73.839700">FC Road</option>
        <option value="18.520500,73.855000">Deccan</option>
        <option value="18.539000,73.901600">Koregaon Park</option>
        <option value="18.559600,73.793800">Baner</option>
        <option value="18.563000,73.820300">Aundh</option>
        <option value="18.593300,73.738800">Hinjewadi</option>
        <option value="18.498800,73.810700">Kothrud</option>
        <option value="18.553700,73.900600">Yerawada</option>
        <option value="18.598000,73.781400">Pimple Saudagar</option>
        <option value="18.516700,73.856200">Camp</option>
        <option value="18.506500,73.914300">Magarpatta</option>
        <option value="18.528600,73.876800">Pune Railway Station</option>
        <option value="18.430000,73.867600">Katraj</option>
        <option value="18.490000,73.924900">Hadapsar</option>
        <option value="custom">-- Custom (enter id / lat,lon / name) --</option>
      </select>
      <input id="srcCustom" class="hidden" type="text" placeholder='e.g. 18.4415653,73.8950396 or 245645011' style="width:220px">

      <label for="dstSelect">End</label>
      <select id="dstSelect" title="Choose destination">
        <option value="">-- choose destination --</option>
        <option value="18.539000,73.901600">Koregaon Park</option>
        <option value="18.498600,73.863800">Swargate</option>
        <option value="18.516500,73.839700">FC Road</option>
        <option value="18.520500,73.855000">Deccan</option>
        <option value="18.531000,73.856700">Shivaji Nagar</option>
        <option value="18.559600,73.793800">Baner</option>
        <option value="18.563000,73.820300">Aundh</option>
        <option value="18.593300,73.738800">Hinjewadi</option>
        <option value="18.498800,73.810700">Kothrud</option>
        <option value="18.553700,73.900600">Yerawada</option>
        <option value="18.598000,73.781400">Pimple Saudagar</option>
        <option value="18.516700,73.856200">Camp</option>
        <option value="18.506500,73.914300">Magarpatta</option>
        <option value="18.528600,73.876800">Pune Railway Station</option>
        <option value="18.430000,73.867600">Katraj</option>
        <option value="18.490000,73.924900">Hadapsar</option>
        <option value="custom">-- Custom (enter id / lat,lon / name) --</option>
      </select>
      <input id="dstCustom" class="hidden" type="text" placeholder='e.g. 18.4472028,73.8589186 or 245645101' style="width:220px">

      <select id="mode" title="1 fastest, 2 safest"><option value="1">Fastest</option><option value="2">Safest</option></select>
      <button id="go">Compute Route</button>
      <button id="sampleCoords" title="Quick sample coords">Sample coords</button>
      <div class="small" style="margin-left:8px">Select names (sends coords) or choose Custom → paste OSM id / coords / name</div>
    </div>
    <div style="margin-left:auto;font-size:13px;opacity:0.9">Pune demo — pre-saved locations (no online lookups)</div>
  </div>

  <div id="map"></div>
  <div id="log" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([18.5204,73.8567], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

    let routeLayer = null;
    let markers = [];

    function showLog(text, show=true){
      const el = document.getElementById('log');
      el.hidden = !show;
      el.innerText = text;
    }

    // toggle custom input visibility when "custom" selected
    function bindCustomToggle(selectId, customId){
      const sel = document.getElementById(selectId);
      const custom = document.getElementById(customId);
      sel.addEventListener('change', ()=>{
        if(sel.value === 'custom') custom.classList.remove('hidden');
        else custom.classList.add('hidden');
      });
      // initial state
      if(sel.value === 'custom') custom.classList.remove('hidden'); else custom.classList.add('hidden');
    }
    bindCustomToggle('srcSelect', 'srcCustom');
    bindCustomToggle('dstSelect', 'dstCustom');

    async function computeRouteUI(rawSrc, rawDst, mode=1){
      showLog('Requesting route...');
      try {
        const res = await fetch('/route', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ src: String(rawSrc), dst: String(rawDst), mode: mode })
        });
        const data = await res.json();
        // Debug info
        let debug = `HTTP ${res.status}\nReturn: ${data.ok}\n\nSTDERR:\n${data.exec?.stderr || ''}\n\nSTDOUT:\n${data.exec?.stdout || ''}\n\n`;
        if(data.route) debug += '\nRoute found. Nodes: ' + (data.route.nodes?.length || 0);
        showLog(debug, true);

        if(!data.ok){
          console.error('Route error', data);
          return data;
        }

        // draw using node lat/lon (works without separate edges_geom)
        const nodes = data.route.nodes || [];
        if(!nodes || nodes.length < 2){
          console.warn('route nodes missing or short', nodes);
          return data;
        }

        // Clear old layers
        if(routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
        markers.forEach(m => map.removeLayer(m)); markers = [];

        const latlngs = nodes.map(n => [n.lat, n.lon]);
        routeLayer = L.polyline(latlngs, {weight:6}).addTo(map);
        map.fitBounds(routeLayer.getBounds(), {padding:[40,40]});

        // markers
        const start = nodes[0]; const end = nodes[nodes.length-1];
        markers.push(L.marker([start.lat, start.lon]).bindPopup('Start: '+(start.label||start.node_id)).addTo(map));
        markers.push(L.marker([end.lat, end.lon]).bindPopup('End: '+(end.label||end.node_id)).addTo(map));

        return data;
      } catch(err){
        console.error(err);
        showLog('Network or server error: ' + err.message, true);
      }
    }

    document.getElementById('go').addEventListener('click', () => {
      const srcSel = document.getElementById('srcSelect');
      const dstSel = document.getElementById('dstSelect');
      const src = (srcSel.value === 'custom') ? document.getElementById('srcCustom').value.trim() : srcSel.value;
      const dst = (dstSel.value === 'custom') ? document.getElementById('dstCustom').value.trim() : dstSel.value;
      const m = document.getElementById('mode').value;
      if(!src || !dst){ showLog('Please provide start and end (or choose Custom and enter).', true); return; }
      computeRouteUI(src, dst, m);
    });

    document.getElementById('sampleCoords').addEventListener('click', () => {
      // sample Pune coords to test different inputs quickly
      document.getElementById('srcSelect').value = '18.498600,73.863800'; // Swargate
      document.getElementById('dstSelect').value = '18.539000,73.901600'; // Koregaon Park
    });

    // run default once
    window.addEventListener('load', () => {
      setTimeout(()=> {
        const srcSel = document.getElementById('srcSelect');
        const dstSel = document.getElementById('dstSelect');
        const src = (srcSel.value === 'custom') ? document.getElementById('srcCustom').value.trim() : srcSel.value;
        const dst = (dstSel.value === 'custom') ? document.getElementById('dstCustom').value.trim() : dstSel.value;
        if(src && dst) computeRouteUI(src, dst, document.getElementById('mode').value);
      }, 400);
    });
  </script>
</body>
</html>
